<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Bambu LAN Print for Cura icon. Copyright Matthew Armstrong. PolyForm Noncommercial 1.0.0. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2d2a"/>
      <stop offset="1" stop-color="#101816"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef0"/>
      <stop offset="1" stop-color="#c7d0d4"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <!-- open-frame printer -->
  <rect x="96" y="120" width="28" height="276" rx="10" fill="url(#frame)"/>
  <rect x="96" y="120" width="250" height="28" rx="12" fill="url(#frame)"/>
  <rect x="72" y="384" width="300" height="30" rx="12" fill="url(#frame)"/>
  <!-- gantry + toolhead -->
  <rect x="124" y="214" width="214" height="16" rx="8" fill="#9aa6ab"/>
  <rect x="206" y="196" width="56" height="62" rx="12" fill="#e9eef0"/>
  <path d="M224 258h20l-10 18z" fill="#e9eef0"/>
  <!-- bed + part -->
  <rect x="146" y="344" width="200" height="16" rx="6" fill="#9aa6ab"/>
  <path d="M206 344v-38h56v38z" fill="#22c55e"/>
  <rect x="206" y="306" width="56" height="8" fill="#15803d"/>
  <!-- LAN link: computer -> printer, no cloud -->
  <circle cx="400" cy="158" r="62" fill="#22c55e" stroke="#101816" stroke-width="12"/>
  <g stroke="#fff" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M400 128v42"/>
    <path d="M372 150h56"/>
    <path d="M378 184h44"/>
  </g>
  <g fill="#fff">
    <rect x="366" y="176" width="18" height="18" rx="4"/>
    <rect x="391" y="176" width="18" height="18" rx="4"/>
    <rect x="416" y="176" width="18" height="18" rx="4"/>
    <rect x="391" y="112" width="18" height="18" rx="4"/>
  </g>
</svg>
